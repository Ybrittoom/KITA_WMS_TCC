<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KITA WMS</title>
  <!-- Fonte Inter do Google Fonts para um visual moderno e limpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>

  <main class="login-container">
    <div class="login-header">
      <span class="brand-badge">KITA WMS</span>
      <h1 class="login-title">Gestão e Eficiência Operacional</h1>
      <p class="login-subtitle">Acesse sua conta para gerenciar seu estoque e operações de armazém em tempo real.</p>
    </div>

    <form class="login-form" id="login-form">
      <div class="input-group">
        <label for="email">E-mail corporativo</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="contato@empresa.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="input-group">
        <div class="label-wrapper">
          <label for="senha">Senha</label>
          <a href="#" class="forgot-password" id="forgot-password">Esqueceu a senha?</a>
        </div>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="remember-me">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Lembrar deste dispositivo</label>
      </div>

      <button type="submit" class="btn-primary" id="login-button">Entrar no Sistema</button>
      <p class="login-message" id="login-message" role="status" aria-live="polite"></p>
    </form>

    <footer class="login-footer">
      <p>Ao acessar, você concorda com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a> do KITA WMS.</p>
    </footer>
  </main>

  <script src="/public/js/login.js" defer></script>
</body>
</html>
