<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - KITA WMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/cadastroProduto.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-content">
        <div class="brand-group">
          <span class="brand-badge">KITA WMS</span>
          <div class="company-info">
            <span class="company-label">Empresa logada</span>
            <h2 class="company-name" id="company-name">Carregando...</h2>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="page-actions">
        <div class="page-title-group">
          <h1 class="page-title">Produtos cadastrados</h1>
          <p class="product-count-text">Total de <strong id="total-count">0</strong> produtos na sua empresa.</p>
        </div>
        <button type="button" class="btn-primary" id="btn-open-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Cadastrar produto
        </button>
      </section>

      <p class="page-message" id="products-message" role="status" aria-live="polite"></p>

      <section class="table-card">
        <div class="table-responsive">
          <table class="products-table">
            <thead>
              <tr>
                <th>Produto</th>
                <th>SKU</th>
                <th>Preço</th>
                <th>Estoque mínimo</th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <tr><td colspan="4">Carregando produtos...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modal-title">Novo produto</h2>
          <p class="modal-subtitle">O produto será vinculado à empresa da sessão atual.</p>
        </div>
        <button type="button" class="btn-close" id="btn-close-modal" aria-label="Fechar">&times;</button>
      </div>

      <form class="modal-form" id="product-form">
        <div class="input-group">
          <label for="nome">Nome do produto</label>
          <input type="text" id="nome" name="nome" maxlength="160" required>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label for="sku">Código SKU</label>
            <input type="text" id="sku" name="sku" maxlength="80" required>
          </div>
          <div class="input-group">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" value="0" required>
          </div>
        </div>

        <div class="input-group">
          <label for="estoque_minimo">Estoque mínimo</label>
          <input type="number" id="estoque_minimo" name="estoque_minimo" min="0" step="1" value="0" required>
        </div>

        <p class="form-message" id="form-message" role="alert" aria-live="assertive"></p>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button>
          <button type="submit" class="btn-primary" id="btn-save-product">Salvar produto</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/public/js/cadastroProduto.js" defer></script>
</body>
</html>
